  <script>
    (function () {
      const B = 60 / 124;
      const T0 = 7.16;
      const at = (k) => B * k - T0;
      const tl = gsap.timeline({ paused: true });

      // Arriving out of the picked card: the first world fades up under the
      // zoom's last frames and keeps the forward motion as it settles.
      tl.fromTo("#mt-cam-1", { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "power1.in" }, at(15) - 0.07);
      tl.fromTo("#mt-cam-1", { scale: 1.22 }, { scale: 1, duration: 0.5, ease: "expo.out" }, at(15) - 0.02);

      // Each weapon's name lands just after its cut, blur to sharp, and holds.
      const labels = [
        ["#mt-l1", at(15) + 0.03],
        ["#mt-l2", at(18) + 0.03],
        ["#mt-l3", at(21) + 0.03],
        ["#mt-l4", at(24) + 0.03],
      ];
      labels.forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "expo.out" }, t);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["montage"] = tl;
    })();
