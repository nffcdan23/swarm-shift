    (function () {
      const B = 60 / 124;
      const T0 = 20.65;
      const at = (k) => B * k - T0;
      const tl = gsap.timeline({ paused: true });

      // The core becomes the icon: it appears over the footage's core (the
      // icon's ring matches it at 0.65), then grows, rises and opens to the
      // icon's rounded square while the arena ground comes up behind it.
      tl.fromTo(
        "#ec-icon",
        { opacity: 0, scale: 0.65, y: 0, clipPath: "inset(29% round 50%)" },
        { opacity: 1, duration: 0.12, ease: "power1.out" },
        at(43) - 0.04,
      );
      tl.to("#ec-bg", { opacity: 1, duration: 0.34, ease: "power2.inOut" }, at(43) + 0.1);
      tl.to("#ec-icon", { y: -392, duration: 0.56, ease: "power3.inOut" }, at(43) + 0.1);
      tl.to("#ec-icon", { scale: 1, duration: 0.62, ease: "back.out(1.25)" }, at(43) + 0.14);
      tl.to("#ec-icon", { clipPath: "inset(0% round 22.5%)", duration: 0.46, ease: "power2.inOut" }, at(43) + 0.16);
      // The arena keeps drifting under the card, as the game's background does.
      tl.fromTo("#ec-grid", { y: 0 }, { y: -48, duration: 4.88, ease: "none" }, 0.1);

      // The ring: an ellipse around the whole lockup, turning 3 degrees a second.
      const foes = Array.from(document.querySelectorAll(".ec-foe"));
      const orbit = { a: 0 };
      const placeRing = () => {
        foes.forEach((el, i) => {
          const ang = ((i / foes.length) * 360 + orbit.a) * (Math.PI / 180);
          const x = 540 + Math.cos(ang) * 470;
          const y = 800 + Math.sin(ang) * 640;
          const face = (Math.atan2(800 - y, 540 - x) * 180) / Math.PI; // point at the core
          el.style.transform = `translate(${(x - 38).toFixed(1)}px, ${(y - 38).toFixed(1)}px) rotate(${face.toFixed(1)}deg)`;
        });
      };
      tl.fromTo(orbit, { a: 0 }, { a: 14.6, duration: 4.88, ease: "none", onUpdate: placeRing }, 0.1);
      placeRing();
      tl.fromTo("#ec-ring", { opacity: 0, scale: 1.18, transformOrigin: "540px 800px" }, { opacity: 0.5, scale: 1, duration: 0.9, ease: "expo.out" }, at(44) - 0.1);
