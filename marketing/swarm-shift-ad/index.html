      :root {
        --color-ground: #05070d;
        --color-ink: #eaf6ff;
        --color-cyan: #2de2ff;
        --color-magenta: #ff3d9a;
        --font-display: "Open Sans";
        --muted: #7c8da6;
        --swarm: #ff6b9a;
        --gold: #ffd15c;
        --red: #ff4d5e;
        --halo: 0 0 16px rgba(5, 7, 13, 0.92), 0 0 40px rgba(5, 7, 13, 0.78), 0 0 84px rgba(5, 7, 13, 0.55);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-ground);
        font-family: var(--font-display), "Open Sans", sans-serif;
      }
    </style>
  </head>

      data-duration="25.645"
